version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: poodplus_db
    environment:
      POSTGRES_DB: poodplus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_parool
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d poodplus"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: poodplus_server
    environment:
      DB_USER: sisestaja
      DB_HOST: db
      DB_NAME: poodplus
      DB_PASSWORD: editor_parool
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: poodplus_frontend
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data:
